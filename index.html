<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f2740">
<title>Thomas McKean Interactive Map — Directions</title>
<style>
:root{--nav:#0f2740;--blue:#2563eb;--sheet:#fff;--text:#0f172a;--muted:#64748b;}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f7;font-family:Arial,Helvetica,sans-serif;color:var(--text);touch-action:none}
button,input{font:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:#f8fafc}
#mapViewport{position:absolute;inset:0;overflow:hidden;background:#fff;touch-action:none;cursor:grab}
#mapViewport.dragging{cursor:grabbing}
.mapStage{position:absolute;left:0;top:0;width:1448px;height:1086px;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-select:none}
.mapStage img{position:absolute;inset:0;width:1448px;height:1086px;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
#mainSvg{position:absolute;inset:0;width:1448px;height:1086px;overflow:visible;pointer-events:none}
.routeLine{fill:none;stroke-width:10;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:8;shape-rendering:geometricPrecision;pointer-events:none}
.routeBlue{stroke:#146ff5} .routeGreen{stroke:#08ad35}
.svgHotspot{fill:transparent;stroke:transparent;stroke-width:3;pointer-events:all;cursor:pointer}
.svgHotspot.active{fill:rgba(249,115,22,.24);stroke:#f97316;stroke-width:4}
.rectHotspot{position:absolute;border:3px solid transparent;background:rgba(255,255,255,.001);cursor:pointer;touch-action:none}
.rectHotspot.active{border-color:#f97316;background:rgba(249,115,22,.22);border-radius:4px}
#lowerStage{display:none;width:1000px;height:750px;background-image:url('mckean-map-v8.jpg');background-repeat:no-repeat;background-size:205%;background-position:31% 84%;background-color:#fff}
#lowerStage.active{display:block}
#mainStage.hidden{display:none}
.topBar{position:absolute;z-index:100;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
.searchWrap{position:relative;flex:1;max-width:760px;pointer-events:auto}
#search{width:100%;height:54px;padding:0 48px 0 18px;border:1px solid rgba(15,39,64,.18);border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 8px 24px rgba(15,23,42,.18);font-size:18px;outline:none}
#search:focus{border-color:#60a5fa;box-shadow:0 8px 28px rgba(37,99,235,.2)}
#searchClear{position:absolute;right:8px;top:7px;width:40px;height:40px;border:0;border-radius:50%;background:#e2e8f0;color:#334155;font-size:22px;display:none}
#searchClear.show{display:block}
.floorSwitch{display:flex;padding:4px;background:rgba(15,39,64,.94);border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.2);pointer-events:auto}
.floorSwitch button{height:46px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:#cbd5e1;font-weight:800}
.floorSwitch button.active{background:#fff;color:#0f2740}
.results{position:absolute;left:0;right:0;top:62px;max-height:min(46vh,420px);overflow:auto;background:rgba(255,255,255,.985);border-radius:16px;box-shadow:0 12px 30px rgba(15,23,42,.24);display:none;padding:6px}
.results.show{display:block}
.result{width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:11px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.result:hover,.result:active{background:#eff6ff}
.result .rname{font-weight:800;font-size:16px} .result .rmeta{font-size:13px;color:#64748b;text-align:right}
.noResults{padding:14px;color:#64748b}
.zoomDock{position:absolute;z-index:90;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;pointer-events:none}
.zoomDock button{pointer-events:auto;width:54px;height:54px;border:0;border-radius:50%;background:#2563eb;color:#fff;font-weight:800;font-size:28px;box-shadow:0 8px 22px rgba(37,99,235,.32)}
.zoomDock button.fit{font-size:17px}
.locationHint{position:absolute;z-index:75;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 13px;border-radius:999px;background:rgba(15,39,64,.88);color:#fff;font-size:13px;pointer-events:none;transition:opacity .25s}
.bottomSheet{position:absolute;z-index:120;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.985);border-radius:22px;box-shadow:0 16px 40px rgba(15,23,42,.28);padding:12px 16px 16px;transform:translateY(calc(100% + 30px));transition:transform .22s ease;pointer-events:auto;max-width:760px;margin:0 auto}
.bottomSheet.open{transform:translateY(0)}
.sheetGrab{width:42px;height:5px;background:#cbd5e1;border-radius:999px;margin:0 auto 9px}
.sheetTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheetTitle{font-size:22px;font-weight:900;line-height:1.1}
.sheetMeta{margin-top:4px;color:#64748b;font-size:14px}
.sheetNote{margin:10px 0 0;font-size:15px;line-height:1.35;color:#334155}
#sheetClose{width:38px;height:38px;border:0;border-radius:50%;background:#e2e8f0;color:#334155;font-size:22px;flex:0 0 auto}
.sheetActions{display:flex;gap:8px;margin-top:12px}
.sheetActions button{border:0;border-radius:12px;height:42px;padding:0 14px;font-weight:800}
#recenterSelected{background:#2563eb;color:#fff}
#clearSelected{background:#e2e8f0;color:#334155}
.lowerHeader{display:none;position:absolute;z-index:85;top:calc(76px + env(safe-area-inset-top));left:14px;padding:8px 12px;border-radius:999px;background:rgba(15,39,64,.9);color:#fff;font-weight:800;pointer-events:none}
.lowerHeader.show{display:block}
.version{position:absolute;right:8px;bottom:4px;z-index:10;font-size:9px;color:#64748b;pointer-events:none}
@media(max-width:640px){
  .topBar{left:8px;right:8px;gap:6px}
  #search{height:50px;border-radius:16px;font-size:16px}
  .floorSwitch button{height:42px;padding:0 10px;font-size:13px}
  .results{top:56px}
  .zoomDock{right:12px;top:54%}
  .zoomDock button{width:50px;height:50px;font-size:25px}
  .zoomDock button.fit{font-size:16px}
  .bottomSheet{left:8px;right:8px;border-radius:20px}
  .sheetTitle{font-size:20px}
  .locationHint{bottom:calc(18px + env(safe-area-inset-bottom));font-size:12px}
}

.sheetSchedule{margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0}
.scheduleHeading{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.scheduleHeading strong{font-size:15px;color:#0f172a}.scheduleSource{font-size:11px;color:#94a3b8;white-space:nowrap}
.scheduleGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scheduleDay{border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;background:#f8fafc}
.scheduleDayTitle{padding:8px 10px;background:#eaf2ff;color:#1e3a8a;font-weight:900;font-size:13px}
.scheduleDay.bday .scheduleDayTitle{background:#ecfdf5;color:#166534}
.scheduleRow{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:8px 10px;border-top:1px solid #e2e8f0;align-items:start}
.scheduleBlock{display:inline-flex;align-items:center;justify-content:center;height:26px;border-radius:8px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:900}
.bday .scheduleBlock{background:#dcfce7;color:#15803d}
.schedulePeople{min-width:0}.schedulePerson{font-size:13px;line-height:1.25;color:#0f172a}
.schedulePerson+.schedulePerson{margin-top:6px;padding-top:6px;border-top:1px dashed #cbd5e1}
.scheduleTeacher{font-weight:800}.scheduleCourse{color:#475569;margin-top:1px}.scheduleCode{color:#94a3b8;font-size:11px;margin-top:1px}
.scheduleOpen{font-size:12px;color:#94a3b8;font-style:italic;padding-top:4px}
.bottomSheet{max-height:min(76vh,680px);overflow-y:auto;overscroll-behavior:contain}
@media(max-width:640px){.scheduleGrid{grid-template-columns:1fr}.bottomSheet{max-height:72vh}}


/* v20 indoor directions */
.routeBar{position:absolute;z-index:105;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 24px));display:none;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-radius:16px;background:rgba(15,39,64,.96);color:#fff;box-shadow:0 10px 28px rgba(15,23,42,.28);pointer-events:auto}
.routeBar.show{display:flex}.routeSummary{flex:1;min-width:0;font-size:13px;line-height:1.25}.routeSummary strong{font-size:15px}.routeSub{opacity:.78;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routeBar button{border:0;border-radius:11px;height:38px;padding:0 12px;font-weight:900}.routeContinue{background:#fff;color:#0f2740;display:none}.routeContinue.show{display:block}.routeClear{width:38px;padding:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px}
.navActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.navActions button{height:46px;border:0;border-radius:13px;font-weight:900}.startHereBtn{background:#0f2740;color:#fff}.directionsBtn{background:#2563eb;color:#fff}.navActions button:disabled{opacity:.45}
.navMessage{display:none;margin-top:9px;padding:9px 11px;border-radius:11px;background:#eff6ff;color:#1e40af;font-size:13px;font-weight:700}.navMessage.show{display:block}
.navHalo{fill:none;stroke:#fff;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;opacity:.96;pointer-events:none}.navPath{fill:none;stroke:#7c3aed;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.navStart{fill:#16a34a;stroke:#fff;stroke-width:5}.navEnd{fill:#dc2626;stroke:#fff;stroke-width:5}.navEndRing{fill:none;stroke:#dc2626;stroke-width:4;opacity:.35}
#lowerNavSvg{position:absolute;inset:0;width:1000px;height:750px;z-index:8;overflow:visible;pointer-events:none}.rectHotspot{z-index:12}
@media(max-width:640px){.routeBar{top:calc(68px + env(safe-area-inset-top));width:calc(100% - 16px)}.routeSummary{font-size:12px}.routeSummary strong{font-size:14px}.routeBar button{padding:0 9px}.navActions button{font-size:14px}}

</style>
</head>
<body>
<div id="app">
  <div id="mapViewport" aria-label="Interactive school map">
    <div id="mainStage" class="mapStage">
      <img src="mckean-map-v8.jpg" alt="Thomas McKean High School map">
      <svg id="mainSvg" viewBox="0 0 1448 1086" aria-hidden="false">
        <g id="routes" aria-hidden="true">
          <image id="staticRoutes" href="static-routes.png" x="0" y="0" width="1448" height="1086" preserveAspectRatio="none" style="pointer-events:none"/>
        </g>
        <g id="navLayer" aria-hidden="true">
          <path id="navHalo" class="navHalo" d=""></path>
          <path id="navPath" class="navPath" d=""></path>
          <circle id="navStart" class="navStart" r="10" cx="-100" cy="-100"></circle>
          <circle id="navEndRing" class="navEndRing" r="18" cx="-100" cy="-100"></circle>
          <circle id="navEnd" class="navEnd" r="10" cx="-100" cy="-100"></circle>
        </g>
        <g id="roomPolys"></g>
      </svg>
    </div>
    <div id="lowerStage" class="mapStage">
      <svg id="lowerNavSvg" viewBox="0 0 1000 750" aria-hidden="true">
        <path id="lowerNavHalo" class="navHalo" d=""></path>
        <path id="lowerNavPath" class="navPath" d=""></path>
        <circle id="lowerNavStart" class="navStart" r="10" cx="-100" cy="-100"></circle>
        <circle id="lowerNavEndRing" class="navEndRing" r="18" cx="-100" cy="-100"></circle>
        <circle id="lowerNavEnd" class="navEnd" r="10" cx="-100" cy="-100"></circle>
      </svg>
    </div>
  </div>

  <div class="topBar">
    <div class="searchWrap">
      <input id="search" placeholder="Search room or place..." autocomplete="off" inputmode="search">
      <button id="searchClear" aria-label="Clear search">×</button>
      <div id="results" class="results"></div>
    </div>
    <div class="floorSwitch" aria-label="Floor selector">
      <button id="mainFloorBtn" class="active">Main</button>
      <button id="lowerFloorBtn">Lower</button>
    </div>
  </div>

  <div id="routeBar" class="routeBar" aria-live="polite">
    <div class="routeSummary"><strong id="routeTitle">Directions</strong><div id="routeSub" class="routeSub"></div></div>
    <button id="routeContinue" class="routeContinue" type="button">Continue</button>
    <button id="routeClear" class="routeClear" type="button" aria-label="Clear route">×</button>
  </div>

  <div id="lowerHeader" class="lowerHeader">Lower Level</div>

  <div class="zoomDock">
    <button id="zoomInBtn" aria-label="Zoom in">+</button>
    <button id="zoomOutBtn" aria-label="Zoom out">−</button>
    <button id="fitBtn" class="fit" aria-label="Fit map">Fit</button>
  </div>

  <div id="hint" class="locationHint">Pinch to zoom • Drag to move • Search for a room</div>

  <div id="sheet" class="bottomSheet" aria-live="polite">
    <div class="sheetGrab"></div>
    <div class="sheetTop">
      <div>
        <div id="sheetTitle" class="sheetTitle"></div>
        <div id="sheetMeta" class="sheetMeta"></div>
      </div>
      <button id="sheetClose" aria-label="Close">×</button>
    </div>
    <div id="sheetNote" class="sheetNote"></div>
    <div class="navActions">
      <button id="startHereBtn" class="startHereBtn" type="button">Start here</button>
      <button id="directionsBtn" class="directionsBtn" type="button">Directions</button>
    </div>
    <div id="navMessage" class="navMessage"></div>
    <div id="sheetSchedule" class="sheetSchedule">
      <div class="scheduleHeading"><strong>Room schedule</strong><span class="scheduleSource">2026–2027 Master Schedule</span></div>
      <div id="scheduleGrid" class="scheduleGrid"></div>
    </div>
    <div class="sheetActions">
      <button id="recenterSelected">Center on map</button>
      <button id="clearSelected">Clear</button>
    </div>
  </div>
  <div class="version">v20b directions + aligned routes</div>
</div>

function fit(){
  const r=viewport.getBoundingClientRect(), s=stageNaturalSize();

  scale=Math.max(minScale,Math.min(1.25,scale));
  tx=(r.width-s.w*scale)/2;
  ty=topPad+(availH-s.h*scale)/2;

}

function zoomAt(clientX,clientY,newScale){

}

function shortestNodePath(nodes,adj,start,end){const dist={},prev={},q=new Set(Object.keys(nodes));for(const k of q)dist[k]=Infinity;dist[start]=0;while(q.size){let u=null,ud=Infinity;for(const k of q)if(dist[k]<ud){u=k;ud=dist[k];}if(u===null)break;q.delete(u);if(u===end)break;for(const [v,w] of adj[u])if(q.has(v)&&dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u;}}const path=[];let u=end;if(start!==end&&!prev[u])return [start,end];while(u){path.unshift(u);if(u===start)break;u=prev[u];}return path;}
function floorRoutePoints(start,dest,floorName){const nodes=floorName==='main'?MAIN_NAV_NODES:LOWER_NAV_NODES,adj=floorName==='main'?MAIN_ADJ:LOWER_ADJ;const sp=roomPoint(start),dp=roomPoint(dest);const sc=floorName==='main'?mainNodeCandidates(start,sp):lowerNodeCandidates(start),dc=floorName==='main'?mainNodeCandidates(dest,dp):lowerNodeCandidates(dest);const sn=nearestNode(sp,nodes,sc),dn=nearestNode(dp,nodes,dc),keys=shortestNodePath(nodes,adj,sn,dn);return [sp,...keys.map(k=>({x:nodes[k][0],y:nodes[k][1]})),dp];}
function accessPointRoom(level){if(level==='Main Floor')return allRooms.find(r=>r.id==='Main Gym / Lower Level Access')||{id:'Lower Level Access',level:'Main Floor',x:65.2,y:53.2,w:4,h:4};return {id:'Stairs',level:'Lower Level',x:57,y:37,w:10,h:10};}
function pathD(points){return points.length?'M '+points.map(p=>`${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L '):'';}
function setSvgRoute(points,floorName){const els=floorName==='main'?[navHalo,navPath,navStart,navEnd,navEndRing]:[lowerNavHalo,lowerNavPath,lowerNavStart,lowerNavEnd,lowerNavEndRing];const [halo,path,st,en,ring]=els,d=pathD(points);halo.setAttribute('d',d);path.setAttribute('d',d);if(points.length){const a=points[0],b=points[points.length-1];st.setAttribute('cx',a.x);st.setAttribute('cy',a.y);en.setAttribute('cx',b.x);en.setAttribute('cy',b.y);ring.setAttribute('cx',b.x);ring.setAttribute('cy',b.y);}else{[st,en,ring].forEach(e=>{e.setAttribute('cx',-100);e.setAttribute('cy',-100);});}}
function clearSvgRoutes(){setSvgRoute([],'main');setSvgRoute([],'lower');}
function fitRoutePoints(points){if(!points||!points.length)return;const r=viewport.getBoundingClientRect(),s=stageNaturalSize(),xs=points.map(p=>p.x),ys=points.map(p=>p.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=90;const bw=Math.max(140,maxX-minX+pad*2),bh=Math.max(140,maxY-minY+pad*2),availW=Math.max(200,r.width-30),availH=Math.max(220,r.height-190);scale=clampScale(Math.min(availW/bw,availH/bh,2.2));tx=r.width/2-((minX+maxX)/2)*scale;ty=95+availH/2-((minY+maxY)/2)*scale;applyTransform();}
function updateRouteBar(){if(!routeStartRoom){routeBar.classList.remove('show');return;}routeBar.classList.add('show');routeContinue.classList.remove('show');if(routeAwaitingDestination){routeTitle.textContent=`Start: ${routeStartRoom.id}`;routeSub.textContent='Tap or search for your destination';return;}if(!routeDestRoom){routeTitle.textContent=`Start: ${routeStartRoom.id}`;routeSub.textContent='Choose a destination';return;}routeTitle.textContent=`${routeStartRoom.id} → ${routeDestRoom.id}`;if(routeStartRoom.level===routeDestRoom.level){routeSub.textContent='Follow the highlighted hallway route';}else{const onStartFloor=(floor==='main'&&routeStartRoom.level!=='Lower Level')||(floor==='lower'&&routeStartRoom.level==='Lower Level');routeSub.textContent=onStartFloor?'Part 1 of 2 • Go to the Lower Level stairs':'Part 2 of 2 • Continue to your destination';routeContinue.textContent=onStartFloor?(floor==='main'?'Continue downstairs':'Continue upstairs'):(floor==='main'?'Show lower-floor route':'Show main-floor route');routeContinue.classList.add('show');}}
function renderActiveRoute(autoFit=false){clearSvgRoutes();if(!routeStartRoom||!routeDestRoom)return;let points=[];if(routeStartRoom.level===routeDestRoom.level){const rf=routeStartRoom.level==='Lower Level'?'lower':'main';if(floor!==rf)setFloor(rf,false);points=floorRoutePoints(routeStartRoom,routeDestRoom,rf);setSvgRoute(points,rf);}else if(floor==='main'){
    const mainRoom=routeStartRoom.level==='Lower Level'?routeDestRoom:routeStartRoom, access=accessPointRoom('Main Floor');points=routeStartRoom.level==='Lower Level'?floorRoutePoints(access,mainRoom,'main'):floorRoutePoints(mainRoom,access,'main');setSvgRoute(points,'main');
  }else{
    const lowRoom=routeStartRoom.level==='Lower Level'?routeStartRoom:routeDestRoom, access=accessPointRoom('Lower Level');points=routeStartRoom.level==='Lower Level'?floorRoutePoints(lowRoom,access,'lower'):floorRoutePoints(access,lowRoom,'lower');setSvgRoute(points,'lower');
  }updateRouteBar();if(autoFit)requestAnimationFrame(()=>fitRoutePoints(points));}
function beginFrom(room){routeStartRoom=room;routeDestRoom=null;routeAwaitingDestination=true;activeRoute=null;clearSvgRoutes();updateRouteBar();navMessage.textContent=`Starting at ${room.id}. Now tap or search for the room you need.`;navMessage.classList.add('show');search.placeholder='Search destination...';sheet.classList.remove('open');}
function buildRoute(start,dest){if(!start||!dest||start.id===dest.id)return;routeStartRoom=start;routeDestRoom=dest;routeAwaitingDestination=false;activeRoute={start,dest};navMessage.textContent=`Route: ${start.id} → ${dest.id}`;navMessage.classList.add('show');search.placeholder='Search room or place...';renderActiveRoute(true);}
function clearRoute(){routeStartRoom=null;routeDestRoom=null;routeAwaitingDestination=false;activeRoute=null;clearSvgRoutes();routeBar.classList.remove('show');navMessage.classList.remove('show');search.placeholder='Search room or place...';}

function showRoom(room,el,center=true){
  const targetFloor=room.level==='Lower Level'?'lower':'main';
  if(targetFloor!==floor) setFloor(targetFloor,false);
  clearActive(); selectedRoom=room; selectedEl=el||room._el; if(selectedEl)selectedEl.classList.add('active');
  sheetTitle.textContent=room.id; sheetMeta.textContent=`${room.level} • ${room.type}`; sheetNote.textContent=room.note||''; renderRoomSchedule(room); sheet.classList.add('open');
  startHereBtn.textContent=(routeStartRoom&&routeStartRoom.id===room.id)?'Starting point ✓':'Start here';
  directionsBtn.textContent=(routeStartRoom&&routeStartRoom.id!==room.id)?'Route here':'Directions';
  navMessage.classList.toggle('show',!!(routeStartRoom||routeDestRoom));
  results.classList.remove('show'); search.blur();
  if(routeAwaitingDestination&&routeStartRoom&&room.id!==routeStartRoom.id){buildRoute(routeStartRoom,room);center=false;}
  if(center) requestAnimationFrame(()=>centerRoom(room));
}
function addHotspot(room,parent){
  let el;
  if(parent===mainStage && Array.isArray(room.poly)&&room.poly.length>=3){
    el=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    el.setAttribute('points',room.poly.map(p=>p.join(',')).join(' ')); el.setAttribute('class','svgHotspot'); roomPolys.appendChild(el);
  } else {
    el=document.createElement('div'); el.className='rectHotspot';
    el.style.left=room.x+'%';el.style.top=room.y+'%';el.style.width=room.w+'%';el.style.height=room.h+'%'; parent.appendChild(el);
  }
  el.setAttribute('aria-label',room.id); el.dataset.roomId=room.id;
  el.addEventListener('click',e=>{
    e.stopPropagation();
    if(window.PointerEvent && e.detail!==0) return;
    if(suppressClick){suppressClick=false;return;}
    showRoom(room,el,true);
  }); room._el=el;
}
mainRooms.forEach(r=>addHotspot(r,mainStage)); lowerRooms.forEach(r=>addHotspot(r,lowerStage));

function setFloor(next,doFit=true){
  if(next===floor)return;
  floor=next; clearActive(); selectedRoom=null; sheet.classList.remove('open'); results.classList.remove('show');
  mainStage.classList.toggle('hidden',floor!=='main'); lowerStage.classList.toggle('active',floor==='lower');
  mainFloorBtn.classList.toggle('active',floor==='main'); lowerFloorBtn.classList.toggle('active',floor==='lower'); lowerHeader.classList.toggle('show',floor==='lower');
  tx=0;ty=0;scale=1; if(doFit)requestAnimationFrame(fit); else applyTransform(); if(activeRoute)requestAnimationFrame(()=>renderActiveRoute(false));
}
mainFloorBtn.onclick=()=>setFloor('main'); lowerFloorBtn.onclick=()=>setFloor('lower');

function textFor(r){return [r.id,r.type,r.level,...(r.aliases||[]),r.note||''].join(' ').toLowerCase();}
function score(r,q){const id=r.id.toLowerCase(), a=(r.aliases||[]).map(x=>String(x).toLowerCase()); if(id===q)return 0;if(a.includes(q))return 1;if(id.startsWith(q))return 2;if(a.some(x=>x.startsWith(q)))return 3;if(id.includes(q))return 4;if(a.some(x=>x.includes(q)))return 5;if(textFor(r).includes(q))return 6;return 99;}
function updateResults(){
  const q=search.value.trim().toLowerCase(); results.innerHTML=''; searchClear.classList.toggle('show',!!q); if(!q){results.classList.remove('show');return;}
  const matches=allRooms.map(r=>({r,s:score(r,q)})).filter(x=>x.s<99).sort((a,b)=>a.s-b.s||a.r.id.localeCompare(b.r.id)).slice(0,30);
  if(!matches.length){results.innerHTML='<div class="noResults">No matching room or location.</div>';results.classList.add('show');return;}
  for(const {r} of matches){const b=document.createElement('button');b.className='result';b.type='button';b.innerHTML=`<span class="rname">${r.id}</span><span class="rmeta">${r.level}<br>${r.type}</span>`;b.onclick=()=>{search.value=r.id;searchClear.classList.add('show');showRoom(r,r._el,true);};results.appendChild(b);}
  results.classList.add('show');
}
search.addEventListener('input',updateResults); search.addEventListener('focus',updateResults);
search.addEventListener('keydown',e=>{if(e.key==='Escape'){results.classList.remove('show');search.blur();} if(e.key==='Enter'){const q=search.value.trim().toLowerCase();const m=allRooms.map(r=>({r,s:score(r,q)})).filter(x=>x.s<99).sort((a,b)=>a.s-b.s)[0]; if(m){e.preventDefault();showRoom(m.r,m.r._el,true);}}});
searchClear.onclick=()=>{search.value='';results.classList.remove('show');searchClear.classList.remove('show');search.focus();};

viewport.addEventListener('pointerdown',e=>{
  if(e.target!==viewport && !e.target.closest('.mapStage'))return;
  search.blur();results.classList.remove('show'); hint.style.opacity='0';

  const tappedRoom=roomFromElement(e.target);
  if(pointers.size===0){
    tapCandidateRoomId=tappedRoom ? tappedRoom.id : null;
    tapStartX=e.clientX; tapStartY=e.clientY; tapMoved=false;
  }

  viewport.setPointerCapture?.(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    dragStart={x:e.clientX,y:e.clientY,tx,ty,startX:e.clientX,startY:e.clientY};
    suppressClick=false;
    viewport.classList.add('dragging');
  }
  if(pointers.size===2){
    tapMoved=true; tapCandidateRoomId=null;
    const pts=[...pointers.values()];
    const dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y;
    pinchStart={dist:Math.hypot(dx,dy),scale,tx,ty,cx:(pts[0].x+pts[1].x)/2,cy:(pts[0].y+pts[1].y)/2};
  }
});
viewport.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1&&dragStart){
    const moved=Math.hypot(e.clientX-tapStartX,e.clientY-tapStartY);
    if(moved>8){
      tapMoved=true;
      suppressClick=true;
      tx=dragStart.tx+(e.clientX-dragStart.x);
      ty=dragStart.ty+(e.clientY-dragStart.y);
      applyTransform();
    }
  }
  else if(pointers.size===2&&pinchStart){
    tapMoved=true; tapCandidateRoomId=null;
    const pts=[...pointers.values()];
    const dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y;
    const dist=Math.hypot(dx,dy);
    const ns=pinchStart.scale*(dist/pinchStart.dist);
    zoomAt(pinchStart.cx,pinchStart.cy,ns);
  }
});
function endPointer(e){
  const wasSingle=pointers.size===1;
  const roomId=tapCandidateRoomId;
  const shouldTap=wasSingle && !tapMoved && !!roomId;

  pointers.delete(e.pointerId);
  viewport.classList.remove('dragging');

  if(shouldTap){
    const room=allRooms.find(r=>r.id===roomId);
    if(room) showRoom(room,room._el,true);
  }

  if(pointers.size===1){
    const p=[...pointers.values()][0];
    dragStart={x:p.x,y:p.y,tx,ty,startX:p.x,startY:p.y};
  }else{
    dragStart=null;pinchStart=null;
    tapCandidateRoomId=null;tapMoved=false;
  }
  if(suppressClick)setTimeout(()=>{suppressClick=false;},80);
}
viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
viewport.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,scale*(e.deltaY<0?1.12:.89));},{passive:false});
viewport.addEventListener('dblclick',e=>{zoomAt(e.clientX,e.clientY,scale*1.35);});

document.getElementById('zoomInBtn').onclick=()=>zoomAt(viewport.clientWidth/2,viewport.clientHeight/2,scale*1.22);
document.getElementById('zoomOutBtn').onclick=()=>zoomAt(viewport.clientWidth/2,viewport.clientHeight/2,scale*.82);
document.getElementById('fitBtn').onclick=fit;
document.getElementById('sheetClose').onclick=()=>sheet.classList.remove('open');
document.getElementById('clearSelected').onclick=clearSelection;
document.getElementById('recenterSelected').onclick=()=>{if(selectedRoom)centerRoom(selectedRoom);};
startHereBtn.onclick=()=>{if(selectedRoom)beginFrom(selectedRoom);};
directionsBtn.onclick=()=>{if(!selectedRoom)return;if(!routeStartRoom||routeStartRoom.id===selectedRoom.id){beginFrom(selectedRoom);}else{buildRoute(routeStartRoom,selectedRoom);}};
routeClear.onclick=clearRoute;
routeContinue.onclick=()=>{if(!activeRoute)return;setFloor(floor==='main'?'lower':'main',false);requestAnimationFrame(()=>{renderActiveRoute(true);});};
window.addEventListener('orientationchange',()=>setTimeout(fit,180));
window.addEventListener('resize',()=>{if(window.innerWidth>700)setTimeout(fit,80);});
requestAnimationFrame(fit);
</script>
