<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f2740">
<title>Thomas McKean Interactive Map</title>
<style>
:root{--nav:#0f2740;--blue:#2563eb;--sheet:#fff;--text:#0f172a;--muted:#64748b;}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f7;font-family:Arial,Helvetica,sans-serif;color:var(--text);touch-action:none}
button,input{font:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:#f8fafc}
#mapViewport{position:absolute;inset:0;overflow:hidden;background:#fff;touch-action:none;cursor:grab}
#mapViewport.dragging{cursor:grabbing}
.mapStage{position:absolute;left:0;top:0;width:1448px;height:1086px;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-select:none}
.mapStage img{position:absolute;inset:0;width:1448px;height:1086px;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
#mainSvg{position:absolute;inset:0;width:1448px;height:1086px;overflow:visible;pointer-events:none}
.routeLine{fill:none;stroke-width:10;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:8;shape-rendering:geometricPrecision;pointer-events:none}
.routeBlue{stroke:#146ff5} .routeGreen{stroke:#08ad35}
.svgHotspot{fill:transparent;stroke:transparent;stroke-width:3;pointer-events:all;cursor:pointer}
.svgHotspot.active{fill:rgba(249,115,22,.24);stroke:#f97316;stroke-width:4}
.rectHotspot{position:absolute;border:3px solid transparent;background:rgba(255,255,255,.001);cursor:pointer;touch-action:none}
.rectHotspot.active{border-color:#f97316;background:rgba(249,115,22,.22);border-radius:4px}
#lowerStage{display:none;width:1000px;height:750px;background-image:url('mckean-map-v8.jpg');background-repeat:no-repeat;background-size:205%;background-position:31% 84%;background-color:#fff}
#lowerStage.active{display:block}
#mainStage.hidden{display:none}
.topBar{position:absolute;z-index:100;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
.searchWrap{position:relative;flex:1;max-width:760px;pointer-events:auto}
#search{width:100%;height:54px;padding:0 48px 0 18px;border:1px solid rgba(15,39,64,.18);border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 8px 24px rgba(15,23,42,.18);font-size:18px;outline:none}
#search:focus{border-color:#60a5fa;box-shadow:0 8px 28px rgba(37,99,235,.2)}
#searchClear{position:absolute;right:8px;top:7px;width:40px;height:40px;border:0;border-radius:50%;background:#e2e8f0;color:#334155;font-size:22px;display:none}
#searchClear.show{display:block}
.floorSwitch{display:flex;padding:4px;background:rgba(15,39,64,.94);border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.2);pointer-events:auto}
.floorSwitch button{height:46px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:#cbd5e1;font-weight:800}
.floorSwitch button.active{background:#fff;color:#0f2740}
.results{position:absolute;left:0;right:0;top:62px;max-height:min(46vh,420px);overflow:auto;background:rgba(255,255,255,.985);border-radius:16px;box-shadow:0 12px 30px rgba(15,23,42,.24);display:none;padding:6px}
.results.show{display:block}
.result{width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:11px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.result:hover,.result:active{background:#eff6ff}
.result .rname{font-weight:800;font-size:16px} .result .rmeta{font-size:13px;color:#64748b;text-align:right}
.noResults{padding:14px;color:#64748b}
.zoomDock{position:absolute;z-index:90;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;pointer-events:none}
.zoomDock button{pointer-events:auto;width:54px;height:54px;border:0;border-radius:50%;background:#2563eb;color:#fff;font-weight:800;font-size:28px;box-shadow:0 8px 22px rgba(37,99,235,.32)}
.zoomDock button.fit{font-size:17px}
.locationHint{position:absolute;z-index:75;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 13px;border-radius:999px;background:rgba(15,39,64,.88);color:#fff;font-size:13px;pointer-events:none;transition:opacity .25s}
.bottomSheet{position:absolute;z-index:120;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.985);border-radius:22px;box-shadow:0 16px 40px rgba(15,23,42,.28);padding:12px 16px 16px;transform:translateY(calc(100% + 30px));transition:transform .22s ease;pointer-events:auto;max-width:760px;margin:0 auto}
.bottomSheet.open{transform:translateY(0)}
.sheetGrab{width:42px;height:5px;background:#cbd5e1;border-radius:999px;margin:0 auto 9px}
.sheetTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheetTitle{font-size:22px;font-weight:900;line-height:1.1}
.sheetMeta{margin-top:4px;color:#64748b;font-size:14px}
.sheetNote{margin:10px 0 0;font-size:15px;line-height:1.35;color:#334155}
#sheetClose{width:38px;height:38px;border:0;border-radius:50%;background:#e2e8f0;color:#334155;font-size:22px;flex:0 0 auto}
.sheetActions{display:flex;gap:8px;margin-top:12px}
.sheetActions button{border:0;border-radius:12px;height:42px;padding:0 14px;font-weight:800}
#recenterSelected{background:#2563eb;color:#fff}
#clearSelected{background:#e2e8f0;color:#334155}
.lowerHeader{display:none;position:absolute;z-index:85;top:calc(76px + env(safe-area-inset-top));left:14px;padding:8px 12px;border-radius:999px;background:rgba(15,39,64,.9);color:#fff;font-weight:800;pointer-events:none}
.lowerHeader.show{display:block}
.version{position:absolute;right:8px;bottom:4px;z-index:10;font-size:9px;color:#64748b;pointer-events:none}
@media(max-width:640px){
  .topBar{left:8px;right:8px;gap:6px}
  #search{height:50px;border-radius:16px;font-size:16px}
  .floorSwitch button{height:42px;padding:0 10px;font-size:13px}
  .results{top:56px}
  .zoomDock{right:12px;top:54%}
  .zoomDock button{width:50px;height:50px;font-size:25px}
  .zoomDock button.fit{font-size:16px}
  .bottomSheet{left:8px;right:8px;border-radius:20px}
  .sheetTitle{font-size:20px}
  .locationHint{bottom:calc(18px + env(safe-area-inset-bottom));font-size:12px}
}

.sheetSchedule{margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0}
.scheduleHeading{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.scheduleHeading strong{font-size:15px;color:#0f172a}.scheduleSource{font-size:11px;color:#94a3b8;white-space:nowrap}
.scheduleGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scheduleDay{border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;background:#f8fafc}
.scheduleDayTitle{padding:8px 10px;background:#eaf2ff;color:#1e3a8a;font-weight:900;font-size:13px}
.scheduleDay.bday .scheduleDayTitle{background:#ecfdf5;color:#166534}
.scheduleRow{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:8px 10px;border-top:1px solid #e2e8f0;align-items:start}
.scheduleBlock{display:inline-flex;align-items:center;justify-content:center;height:26px;border-radius:8px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:900}
.bday .scheduleBlock{background:#dcfce7;color:#15803d}
.schedulePeople{min-width:0}.schedulePerson{font-size:13px;line-height:1.25;color:#0f172a}
.schedulePerson+.schedulePerson{margin-top:6px;padding-top:6px;border-top:1px dashed #cbd5e1}
.scheduleTeacher{font-weight:800}.scheduleCourse{color:#475569;margin-top:1px}.scheduleCode{color:#94a3b8;font-size:11px;margin-top:1px}
.scheduleOpen{font-size:12px;color:#94a3b8;font-style:italic;padding-top:4px}
.bottomSheet{max-height:min(76vh,680px);overflow-y:auto;overscroll-behavior:contain}
@media(max-width:640px){.scheduleGrid{grid-template-columns:1fr}.bottomSheet{max-height:72vh}}

</style>
</head>

  <div id="lowerHeader" class="lowerHeader">Lower Level</div>

  <div class="zoomDock">

    <button id="fitBtn" class="fit" aria-label="Fit map">Fit</button>
  </div>

  <div id="hint" class="locationHint">Pinch to zoom • Drag to move • Search for a room</div>

  <div id="sheet" class="bottomSheet" aria-live="polite">
    <div class="sheetGrab"></div>
    <div class="sheetTop">
      <div>
        <div id="sheetTitle" class="sheetTitle"></div>
        <div id="sheetMeta" class="sheetMeta"></div>
      </div>
      <button id="sheetClose" aria-label="Close">×</button>
    </div>
    <div id="sheetNote" class="sheetNote"></div>
    <div id="sheetSchedule" class="sheetSchedule">
      <div class="scheduleHeading"><strong>Room schedule</strong><span class="scheduleSource">2026–2027 Master Schedule</span></div>
      <div id="scheduleGrid" class="scheduleGrid"></div>
    </div>
    <div class="sheetActions">
      <button id="recenterSelected">Center on map</button>
      <button id="clearSelected">Clear</button>
    </div>
  </div>
  <div class="version">v19 schedule-map</div>
</div>

:"PE 1","code":"0701-7"}],"B2":[{"teacher":"Word (1st sem)","course":"PE 2- Person Fitness/Wgt Train","code":"0702-3"},{"teacher":"Word (2nd sem)","course":"PE 2- Person Fitness/Wgt Train","code":"0702-7"}],"B3":[{"teacher":"Word (1st sem)","course":"PE 1","code":"0701-4"},{"teacher":"Word (2nd sem)","course":"PE 1","code":"0701-8"}],"B4":[{"teacher":"Dorda (1st Sem)","course":"PE 3","code":"0703-2"},{"teacher":"Dorda (2nd Sem)","course":"PE 3","code":"0703-2"}]},"Swimming Pool":{"A3":[{"teacher":"Costenbader (1st Sem)","course":"PE 2 - Lifeguard/CPR/First Aid","code":"0706-1"},{"teacher":"Costenbader (2nd Sem)","course":"PE 2 - Lifeguard/CPR/First Aid","code":"0706-01-01 00:00:00"}]}};
const mainRooms=DATA.mainHotspots, lowerRooms=DATA.lowerHotspots, allRooms=[...mainRooms,...lowerRooms];
const viewport=document.getElementById('mapViewport');
const mainStage=document.getElementById('mainStage'), lowerStage=document.getElementById('lowerStage');
const roomPolys=document.getElementById('roomPolys');
const search=document.getElementById('search'), results=document.getElementById('results'), searchClear=document.getElementById('searchClear');
const mainFloorBtn=document.getElementById('mainFloorBtn'), lowerFloorBtn=document.getElementById('lowerFloorBtn'), lowerHeader=document.getElementById('lowerHeader');
const sheet=document.getElementById('sheet'), sheetTitle=document.getElementById('sheetTitle'), sheetMeta=document.getElementById('sheetMeta'), sheetNote=document.getElementById('sheetNote'), sheetSchedule=document.getElementById('sheetSchedule'), scheduleGrid=document.getElementById('scheduleGrid');
let floor='main', selectedRoom=null, selectedEl=null;
let scale=1, tx=0, ty=0, minScale=.3, maxScale=4;
let pointers=new Map(), dragStart=null, pinchStart=null, suppressClick=false;

function activeStage(){return floor==='main'?mainStage:lowerStage;}
function activeRooms(){return floor==='main'?mainRooms:lowerRooms;}
function applyTransform(){activeStage().style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function stageNaturalSize(){return floor==='main'?{w:1448,h:1086}:{w:1000,h:750};}
function fit(){
  const r=viewport.getBoundingClientRect(), s=stageNaturalSize();
  const topPad=86, bottomPad=30;
  const availW=Math.max(200,r.width-20), availH=Math.max(200,r.height-topPad-bottomPad);
  scale=Math.min(availW/s.w, availH/s.h);
  scale=Math.max(minScale,Math.min(1.25,scale));
  tx=(r.width-s.w*scale)/2;
  ty=topPad+(availH-s.h*scale)/2;
  applyTransform();
}
function clampScale(v){return Math.max(minScale,Math.min(maxScale,v));}
function zoomAt(clientX,clientY,newScale){
  newScale=clampScale(newScale);
  const r=viewport.getBoundingClientRect();
  const px=clientX-r.left, py=clientY-r.top;
  const mx=(px-tx)/scale, my=(py-ty)/scale;
  scale=newScale; tx=px-mx*scale; ty=py-my*scale; applyTransform();
}
function centerRoom(room, zoomTo=1.75){
  const r=viewport.getBoundingClientRect();
  let cx,cy;
  if(Array.isArray(room.poly)&&room.poly.length){
    cx=room.poly.reduce((a,p)=>a+p[0],0)/room.poly.length;
    cy=room.poly.reduce((a,p)=>a+p[1],0)/room.poly.length;
  } else {
    cx=(room.x+room.w/2)/100*1448; cy=(room.y+room.h/2)/100*1086;
  }
  scale=clampScale(Math.max(scale,zoomTo));
  const sheetOffset=sheet.classList.contains('open')?110:0;
  tx=r.width/2-cx*scale; ty=(r.height/2-sheetOffset)-cy*scale; applyTransform();
}
function clearActive(){if(selectedEl)selectedEl.classList.remove('active'); selectedEl=null;}
function clearSelection(){clearActive();selectedRoom=null;sheet.classList.remove('open');}
function escHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function scheduleRowHtml(block,entries){
  if(!entries||!entries.length)return `<div class="scheduleRow"><div class="scheduleBlock">${block}</div><div class="scheduleOpen">No scheduled class</div></div>`;
  return `<div class="scheduleRow"><div class="scheduleBlock">${block}</div><div class="schedulePeople">${entries.map(e=>`<div class="schedulePerson"><div class="scheduleTeacher">${escHtml(e.teacher)}</div>${e.course?`<div class="scheduleCourse">${escHtml(e.course)}</div>`:''}${e.code?`<div class="scheduleCode">${escHtml(e.code)}</div>`:''}</div>`).join('')}</div></div>`;
}
function renderRoomSchedule(room){
  const s=ROOM_SCHEDULE[room.id]||{}, a=['A1','A2','A3','A4'], b=['B1','B2','B3','B4'];
  const hasAny=[...a,...b].some(k=>s[k]&&s[k].length);
  if(!hasAny){scheduleGrid.innerHTML=`<div class="scheduleDay" style="grid-column:1/-1"><div class="scheduleDayTitle">Master Schedule</div><div class="scheduleRow"><div class="scheduleOpen" style="grid-column:1/-1">No regular class assignment is listed for this location.</div></div></div>`;return;}
  scheduleGrid.innerHTML=`<div class="scheduleDay"><div class="scheduleDayTitle">A Day</div>${a.map(k=>scheduleRowHtml(k,s[k])).join('')}</div><div class="scheduleDay bday"><div class="scheduleDayTitle">B Day</div>${b.map(k=>scheduleRowHtml(k,s[k])).join('')}</div>`;
}
function showRoom(room,el,center=true){
  const targetFloor=room.level==='Lower Level'?'lower':'main';
  if(targetFloor!==floor) setFloor(targetFloor,false);
  clearActive(); selectedRoom=room; selectedEl=el||room._el; if(selectedEl)selectedEl.classList.add('active');
  sheetTitle.textContent=room.id; sheetMeta.textContent=`${room.level} • ${room.type}`; sheetNote.textContent=room.note||''; renderRoomSchedule(room); sheet.classList.add('open');
  results.classList.remove('show'); search.blur();
  if(center) requestAnimationFrame(()=>centerRoom(room));
}
function addHotspot(room,parent){
  let el;
  if(parent===mainStage && Array.isArray(room.poly)&&room.poly.length>=3){
    el=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    el.setAttribute('points',room.poly.map(p=>p.join(',')).join(' ')); el.setAttribute('class','svgHotspot'); roomPolys.appendChild(el);
  } else {
    el=document.createElement('div'); el.className='rectHotspot';
    el.style.left=room.x+'%';el.style.top=room.y+'%';el.style.width=room.w+'%';el.style.height=room.h+'%'; parent.appendChild(el);
  }
  el.setAttribute('aria-label',room.id); el.dataset.roomId=room.id;
  el.addEventListener('click',e=>{e.stopPropagation();if(suppressClick){suppressClick=false;return;}showRoom(room,el,true);}); room._el=el;
}
mainRooms.forEach(r=>addHotspot(r,mainStage)); lowerRooms.forEach(r=>addHotspot(r,lowerStage));

function setFloor(next,doFit=true){
  if(next===floor)return;
  floor=next; clearActive(); selectedRoom=null; sheet.classList.remove('open'); results.classList.remove('show');
  mainStage.classList.toggle('hidden',floor!=='main'); lowerStage.classList.toggle('active',floor==='lower');
  mainFloorBtn.classList.toggle('active',floor==='main'); lowerFloorBtn.classList.toggle('active',floor==='lower'); lowerHeader.classList.toggle('show',floor==='lower');
  tx=0;ty=0;scale=1; if(doFit)requestAnimationFrame(fit); else applyTransform();
}
mainFloorBtn.onclick=()=>setFloor('main'); lowerFloorBtn.onclick=()=>setFloor('lower');

function textFor(r){return [r.id,r.type,r.level,...(r.aliases||[]),r.note||''].join(' ').toLowerCase();}
function score(r,q){const id=r.id.toLowerCase(), a=(r.aliases||[]).map(x=>String(x).toLowerCase()); if(id===q)return 0;if(a.includes(q))return 1;if(id.startsWith(q))return 2;if(a.some(x=>x.startsWith(q)))return 3;if(id.includes(q))return 4;if(a.some(x=>x.includes(q)))return 5;if(textFor(r).includes(q))return 6;return 99;}
function updateResults(){
  const q=search.value.trim().toLowerCase(); results.innerHTML=''; searchClear.classList.toggle('show',!!q); if(!q){results.classList.remove('show');return;}
  const matches=allRooms.map(r=>({r,s:score(r,q)})).filter(x=>x.s<99).sort((a,b)=>a.s-b.s||a.r.id.localeCompare(b.r.id)).slice(0,30);
  if(!matches.length){results.innerHTML='<div class="noResults">No matching room or location.</div>';results.classList.add('show');return;}
  for(const {r} of matches){const b=document.createElement('button');b.className='result';b.type='button';b.innerHTML=`<span class="rname">${r.id}</span><span class="rmeta">${r.level}<br>${r.type}</span>`;b.onclick=()=>{search.value=r.id;searchClear.classList.add('show');showRoom(r,r._el,true);};results.appendChild(b);}
  results.classList.add('show');
}
search.addEventListener('input',updateResults); search.addEventListener('focus',updateResults);
search.addEventListener('keydown',e=>{if(e.key==='Escape'){results.classList.remove('show');search.blur();} if(e.key==='Enter'){const q=search.value.trim().toLowerCase();const m=allRooms.map(r=>({r,s:score(r,q)})).filter(x=>x.s<99).sort((a,b)=>a.s-b.s)[0]; if(m){e.preventDefault();showRoom(m.r,m.r._el,true);}}});
searchClear.onclick=()=>{search.value='';results.classList.remove('show');searchClear.classList.remove('show');search.focus();};

viewport.addEventListener('pointerdown',e=>{
  if(e.target!==viewport && !e.target.closest('.mapStage'))return;
  search.blur();results.classList.remove('show'); hint.style.opacity='0';
  viewport.setPointerCapture?.(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){dragStart={x:e.clientX,y:e.clientY,tx,ty,startX:e.clientX,startY:e.clientY};suppressClick=false;viewport.classList.add('dragging');}
  if(pointers.size===2){const pts=[...pointers.values()];const dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y;pinchStart={dist:Math.hypot(dx,dy),scale,tx,ty,cx:(pts[0].x+pts[1].x)/2,cy:(pts[0].y+pts[1].y)/2};}
});
viewport.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1&&dragStart){if(Math.hypot(e.clientX-dragStart.startX,e.clientY-dragStart.startY)>6)suppressClick=true;tx=dragStart.tx+(e.clientX-dragStart.x);ty=dragStart.ty+(e.clientY-dragStart.y);applyTransform();}
  else if(pointers.size===2&&pinchStart){const pts=[...pointers.values()];const dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y;const dist=Math.hypot(dx,dy);const ns=pinchStart.scale*(dist/pinchStart.dist);zoomAt(pinchStart.cx,pinchStart.cy,ns);}
});
function endPointer(e){pointers.delete(e.pointerId);viewport.classList.remove('dragging');if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,tx,ty,startX:p.x,startY:p.y};}else{dragStart=null;pinchStart=null;}if(suppressClick)setTimeout(()=>{suppressClick=false;},80);}
viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
viewport.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,scale*(e.deltaY<0?1.12:.89));},{passive:false});
viewport.addEventListener('dblclick',e=>{zoomAt(e.clientX,e.clientY,scale*1.35);});

document.getElementById('zoomInBtn').onclick=()=>zoomAt(viewport.clientWidth/2,viewport.clientHeight/2,scale*1.22);
document.getElementById('zoomOutBtn').onclick=()=>zoomAt(viewport.clientWidth/2,viewport.clientHeight/2,scale*.82);
document.getElementById('fitBtn').onclick=fit;
document.getElementById('sheetClose').onclick=()=>sheet.classList.remove('open');
document.getElementById('clearSelected').onclick=clearSelection;
document.getElementById('recenterSelected').onclick=()=>{if(selectedRoom)centerRoom(selectedRoom);};
window.addEventListener('orientationchange',()=>setTimeout(fit,180));
window.addEventListener('resize',()=>{if(window.innerWidth>700)setTimeout(fit,80);});
requestAnimationFrame(fit);
