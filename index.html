*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111827}

.controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;max-width:1200px;margin:0 auto}
input{min-width:0;font-size:18px;padding:12px;border:1px solid #cbd5e1;border-radius:12px}
button{border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;padding:10px 12px;min-height:46px;font-size:16px;cursor:pointer}
button.secondary{background:#64748b}
.info{display:none;position:sticky;top:68px;z-index:950;background:#243447;color:#fff;padding:10px 14px;border-top:1px solid rgba(255,255,255,.18);box-shadow:0 2px 10px rgba(0,0,0,.22)}
.info.show{display:block}
.info b,.lowerInfo b{background:rgba(255,255,255,.16);padding:2px 6px;border-radius:5px}
.note{margin:6px 0 0;line-height:1.35;font-size:15px}
.results{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);width:min(1200px,calc(100% - 20px));z-index:1100;background:#243447;color:#fff;padding:8px;gap:6px;max-height:min(42vh,300px);overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.28);border-radius:0 0 12px 12px}

.result{text-align:left;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);border-radius:10px;padding:9px}
.help{padding:10px 12px;color:#475569;font-size:13px;text-align:center}
.mapWrap{width:100%;overflow:visible;text-align:center}
.mapStage{position:relative;width:100%;max-width:1600px;margin:0 auto;background:#fff;text-align:left;display:inline-block;vertical-align:top}
.mapStage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}

.routeBlue{stroke:#146ff5}
.routeGreen{stroke:#08ad35}

.hotspot.active{border-color:#f97316;background:rgba(249,115,22,.22)}
.footerSpace{height:45vh}
.modal{display:none;position:fixed;inset:0;z-index:2000;background:#fff;overflow:auto;-webkit-overflow-scrolling:touch}
.modal.open{display:block}
.modalHead{position:sticky;top:0;z-index:2010;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#243447;color:#fff;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}

.lowerInfo.show{display:block}
.lowerWrap{width:100%;overflow:visible;text-align:center}
.lowerStage{position:relative;width:100%;max-width:1000px;aspect-ratio:4/3;margin:0 auto;background-image:url('mckean-map-v8.jpg?v=1778852366');background-repeat:no-repeat;background-size:205%;background-position:31% 84%;display:inline-block;vertical-align:top;text-align:left}
.lowerStage .hotspot{z-index:20}

.zoomCtl{width:62px;min-width:62px;min-height:62px;height:62px;border-radius:999px;font-size:30px;line-height:1;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.zoomFit{font-size:22px}

@media(max-width:700px){

}

const mainRooms = DATA.mainHotspots, lowerRooms = DATA.lowerHotspots, allRooms = [...mainRooms, ...lowerRooms];
const mainStage=document.getElementById('mainStage'), lowerStage=document.getElementById('lowerStage'), mainWrap=document.getElementById('mainWrap'), lowerWrap=document.getElementById('lowerWrap'), mainSvg=document.getElementById('mainSvg'), roomPolys=document.getElementById('roomPolys');
const info=document.getElementById('info'), nameEl=document.getElementById('name'), meta=document.getElementById('meta'), note=document.getElementById('note');
const lowerInfo=document.getElementById('lowerInfo'), lowerName=document.getElementById('lowerName'), lowerMeta=document.getElementById('lowerMeta'), lowerNote=document.getElementById('lowerNote');
const search=document.getElementById('search'), results=document.getElementById('results'), lowerModal=document.getElementById('lowerModal');
let selectedId=null, activeEl=null, mainZoom=1, lowerZoom=1; let fitTimer = null;
const MIN_ZOOM=.45, MAX_ZOOM=3, STEP=.2;
function addHotspot(room,parent){
  let el;
  if(parent===mainStage && Array.isArray(room.poly) && room.poly.length>=3){
    el=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    el.setAttribute('points',room.poly.map(p=>p[0]+','+p[1]).join(' '));
    el.setAttribute('class','svgHotspot');
    roomPolys.appendChild(el);
  } else {
    el=document.createElement('div');
    el.className='hotspot';
    el.style.left=room.x+'%';el.style.top=room.y+'%';el.style.width=room.w+'%';el.style.height=room.h+'%';
    parent.appendChild(el);
  }
  el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',room.id);el.dataset.roomId=room.id;
  el.addEventListener('click',e=>{e.stopPropagation();handleRoomTap(room,el);});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handleRoomTap(room,el);}});
  room._el=el;
}
function render(){mainRooms.forEach(r=>addHotspot(r,mainStage));lowerRooms.forEach(r=>addHotspot(r,lowerStage));}
function clearActive(){if(activeEl)activeEl.classList.remove('active');activeEl=null;}
function deselect(){clearActive();selectedId=null;info.classList.remove('show');lowerInfo.classList.remove('show');}
function showMainInfo(room){
  info.classList.add('show');
  nameEl.textContent = room.id;
  meta.textContent = ' — ' + room.level + ' • ' + room.type;
  note.textContent = room.note || '';
}
function showLowerInfo(room){
  lowerInfo.classList.add('show');
  lowerName.textContent = room.id;
  lowerMeta.textContent = ' — ' + room.level + ' • ' + room.type;
  lowerNote.textContent = room.note || '';
}
function handleRoomTap(room,el){if(selectedId===room.id){deselect();return;}clearActive();selectedId=room.id;activeEl=el||room._el;if(activeEl)activeEl.classList.add('active');showMainInfo(room);results.classList.remove('show');if(room.action==='open-lower-room'){lowerModal.classList.add('open');const target=allRooms.find(r=>r.id===room.target);if(target){clearActive();selectedId=target.id;activeEl=target._el;if(activeEl)activeEl.classList.add('active');showMainInfo(target);showLowerInfo(target);}return;}if(room.action==='open-lower'){lowerModal.classList.add('open');return;}if(room.level==='Lower Level'){lowerModal.classList.add('open');showLowerInfo(room);}}
function searchTextForRoom(r){
  const aliases = Array.isArray(r.aliases) ? r.aliases : [];
  return [r.id || '', r.type || '', r.level || '', ...aliases, r.note || ''].join(' ').toLowerCase();
}
function roomMatchScore(r, needle){
  const id = String(r.id || '').toLowerCase();
  const aliases = (Array.isArray(r.aliases) ? r.aliases : []).map(a => String(a).toLowerCase());
  if(id === needle) return 0;
  if(aliases.includes(needle)) return 1;
  if(id.startsWith(needle)) return 2;
  if(aliases.some(a => a.startsWith(needle))) return 3;
  if(id.includes(needle)) return 4;
  if(aliases.some(a => a.includes(needle))) return 5;
  if(searchTextForRoom(r).includes(needle)) return 6;
  return 99;
}
function findExactRoom(q){
  const needle = q.trim().toLowerCase();
  if(!needle) return null;
  const ranked = allRooms
    .map(r => ({r, score: roomMatchScore(r, needle)}))
    .filter(x => x.score < 2)
    .sort((a,b) => a.score - b.score || String(a.r.id).localeCompare(String(b.r.id)));
  return ranked.length ? ranked[0].r : null;
}
function updateResults(){
  const q = search.value.trim().toLowerCase();
  results.innerHTML = '';
  if(!q){ results.classList.remove('show'); return; }

  const matches = allRooms
    .map(r => ({r, score: roomMatchScore(r, q)}))
    .filter(x => x.score < 99)
    .sort((a,b) => a.score - b.score || String(a.r.id).localeCompare(String(b.r.id)))
    .slice(0,40);

  if(!matches.length){
    const empty = document.createElement('div');
    empty.className = 'searchEmpty';
    empty.textContent = 'No matching room or location.';
    results.appendChild(empty);
    results.classList.add('show');
    return;
  }

  matches.forEach(({r}) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'result';
    b.innerHTML = '<strong>' + r.id + '</strong><br><span>' + r.level + ' • ' + r.type + '</span>';
    b.addEventListener('click', () => {
      search.value = r.id;
      results.classList.remove('show');
      handleRoomTap(r, r._el);
    });
    results.appendChild(b);
  });
  results.classList.add('show');
}
function currentContext(){return lowerModal.classList.contains('open')?'lower':'main';}

function applyLowerStageZoom(stage,zoom,baseMax){
  if(Math.abs(zoom-1)<.01){
    stage.style.width='100%';
    stage.style.maxWidth=baseMax;
  }else{
    stage.style.maxWidth='none';
    stage.style.width=(zoom*100)+'%';
  }
}

function applyMainInterfaceZoom(){
  appShell.style.zoom=String(mainZoom);
}

function applyZooms(){
  applyMainInterfaceZoom();
  applyLowerStageZoom(lowerStage,lowerZoom,'1000px');
}

function setZoom(z){
  z=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,Math.round(z*100)/100));
  if(currentContext()==='lower') lowerZoom=z;
  else mainZoom=z;
  applyZooms();
}

function fitMap(){
  const isLower=currentContext()==='lower';
  if(isLower){
    // Keep the existing lower-level behavior isolated from the main-page UI.
    const oldW=lowerStage.style.width, oldM=lowerStage.style.maxWidth;
    lowerStage.style.width='100%';
    lowerStage.style.maxWidth='1000px';
    const rect=lowerStage.getBoundingClientRect();
    const modalHead=document.querySelector('.modalHead');
    const stickyH=(modalHead?modalHead.offsetHeight:0)+(lowerInfo.classList.contains('show')?lowerInfo.offsetHeight:0);
    const availableH=Math.max(180,window.innerHeight-stickyH-18);
    const z=Math.max(MIN_ZOOM,Math.min(1,availableH/Math.max(1,rect.height)));
    lowerStage.style.width=oldW; lowerStage.style.maxWidth=oldM;
    lowerZoom=z; applyZooms();
    lowerModal.scrollTo({top:0,left:0,behavior:'smooth'});
    return;
  }

  // Measure the whole interface at 100%, then scale search/info/help/map together.
  const previous=mainZoom;
  mainZoom=1;
  applyMainInterfaceZoom();

  // Close search suggestions for a stable measurement; do not clear the query.
  results.classList.remove('show');

  requestAnimationFrame(()=>{
    const shellRect=appShell.getBoundingClientRect();
    const mapRect=mainStage.getBoundingClientRect();
    const shellTop=shellRect.top+window.scrollY;
    const mapBottom=mapRect.bottom+window.scrollY;
    const contentHeight=Math.max(1,mapBottom-shellTop+8);
    const contentWidth=Math.max(1,appShell.scrollWidth);
    const hScale=(window.innerHeight-10)/contentHeight;
    const wScale=(window.innerWidth-10)/contentWidth;
    mainZoom=Math.max(MIN_ZOOM,Math.min(1,hScale,wScale));
    applyMainInterfaceZoom();
    window.scrollTo({top:0,left:0,behavior:'smooth'});
  });
}

function dismissSearchWithoutJump(){
  if(!results.classList.contains('show') && document.activeElement!==search) return;
  const x=window.scrollX, y=window.scrollY;
  results.classList.remove('show');
  if(document.activeElement===search) search.blur();
  // Mobile browsers can alter the visual viewport when the keyboard closes.
  // Restore the map position after both the immediate and delayed viewport update.
  requestAnimationFrame(()=>window.scrollTo(x,y));
  setTimeout(()=>window.scrollTo(x,y),90);
}

mainStage.addEventListener('pointerdown', ()=>{ dismissSearchWithoutJump(); }, {passive:true});
search.addEventListener('input', updateResults);
search.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    const exact = findExactRoom(search.value);
    if(exact){
      results.classList.remove('show');
      handleRoomTap(exact, exact._el);
      search.blur();
    }
  } else if(e.key === 'Escape'){
    results.classList.remove('show');
    search.blur();
  }
});document.getElementById('clearBtn').addEventListener('click',()=>{search.value='';results.classList.remove('show');deselect();});document.getElementById('lowerBtn').addEventListener('click',()=>lowerModal.classList.add('open'));document.getElementById('closeLower').addEventListener('click',()=>{lowerModal.classList.remove('open');lowerInfo.classList.remove('show');deselect();});
document.getElementById('zoomInBtn').addEventListener('click',()=>setZoom((currentContext()==='lower'?lowerZoom:mainZoom)+STEP));document.getElementById('zoomOutBtn').addEventListener('click',()=>setZoom((currentContext()==='lower'?lowerZoom:mainZoom)-STEP));document.getElementById('zoomFitBtn').addEventListener('click',fitMap);
let lastLayoutWidth=window.innerWidth;
window.addEventListener('resize', ()=>{
  const widthDelta=Math.abs(window.innerWidth-lastLayoutWidth);
  lastLayoutWidth=window.innerWidth;
  if(document.activeElement===search) return;
  if(window.innerWidth>700 && widthDelta>80){
    clearTimeout(fitTimer);
    fitTimer=setTimeout(()=>{ if(currentContext()==='main') fitMap(); },180);
  }
});
window.addEventListener('orientationchange', ()=>{ clearTimeout(fitTimer); fitTimer=setTimeout(()=>{ if(currentContext()==='main') fitMap(); },320); });
render();applyZooms();setTimeout(fitMap, 180);
</script></body></html>
