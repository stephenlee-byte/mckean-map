<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#243447">
<title>Thomas McKean Map</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111827}
body{min-height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
header{position:sticky;top:0;z-index:100;background:#243447;color:#fff;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.controls{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
input{min-width:0;font-size:18px;padding:12px;border:1px solid #cbd5e1;border-radius:12px}
button{border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;padding:10px 12px;min-height:46px;font-size:16px}
button.secondary{background:#64748b}
.info{display:none;position:sticky;top:68px;z-index:90;background:#243447;color:#fff;padding:10px 14px;border-top:1px solid rgba(255,255,255,.18);box-shadow:0 2px 10px rgba(0,0,0,.22)}
.info.show{display:block}
.info b{background:rgba(255,255,255,.16);padding:2px 6px;border-radius:5px}
.note{margin:6px 0 0;line-height:1.35;font-size:15px}
.results{display:none;background:#243447;color:#fff;padding:8px;gap:6px;max-height:260px;overflow:auto}
.results.show{display:grid}
.result{text-align:left;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);border-radius:10px;padding:9px}
.help{padding:10px 12px;color:#475569;font-size:13px;text-align:center}
.mapStage{position:relative;width:100%;max-width:1600px;margin:0 auto;background:white;touch-action:auto}
.mapStage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;border:2px solid transparent;background:transparent;border-radius:4px;cursor:pointer;touch-action:manipulation}
.hotspot.active{border-color:#f97316;background:rgba(249,115,22,.22)}
.footerSpace{height:45vh}
.modal{display:none;position:fixed;inset:0;z-index:1000;background:#fff;overflow:auto}
.modal.open{display:block}
.modalHead{position:sticky;top:0;z-index:1010;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#243447;color:#fff;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.lowerInfo{display:none;position:sticky;top:66px;z-index:1005;background:#243447;color:#fff;padding:10px 14px;border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18)}
.lowerInfo.show{display:block}
.lowerInfo b{background:rgba(255,255,255,.16);padding:2px 6px;border-radius:5px}
.lowerStage{position:relative;width:100%;max-width:1000px;aspect-ratio:4/3;margin:0 auto;background-image:url('mckean-map.jpg');background-repeat:no-repeat;background-size:205%;background-position:31% 84%}
.lowerStage .hotspot{z-index:2}
.refreshIndicator{position:fixed;top:calc(env(safe-area-inset-top,0) + 12px);left:50%;transform:translateX(-50%) translateY(-70px);z-index:2000;background:#ea580c;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;font-weight:900;box-shadow:0 4px 16px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease}
.refreshIndicator.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="refreshIndicator" class="refreshIndicator">Release to refresh</div>
<header>
  <div class="controls">
    <input id="search" placeholder="Search room..." autocomplete="off">
    <button id="lowerBtn" type="button">Lower</button>
    <button id="clearBtn" class="secondary" type="button">Clear</button>
  </div>
</header>

<section id="info" class="info">
  <div><b id="name">—</b> <span id="meta"></span></div>
  <p id="note" class="note"></p>
</section>

<section id="results" class="results"></section>

<main>
  <div class="help">Long pull down anywhere to refresh. Pinch the map to zoom.</div>
  <div class="mapStage" id="mainStage">
    <img src="mckean-map.jpg" alt="Thomas McKean High School map">
  </div>
  <div class="footerSpace"></div>
</main>

<div class="modal" id="lowerModal">
  <div class="modalHead">
    <strong>Lower Level</strong>
    <button id="closeLower" class="secondary" type="button">Back to Main Map</button>
  </div>
  <section id="lowerInfo" class="lowerInfo">
    <div><b id="lowerName">—</b> <span id="lowerMeta"></span></div>
    <p id="lowerNote" class="note"></p>
  </section>
  <div class="lowerStage" id="lowerStage"></div>
  <div class="footerSpace"></div>
</div>

<script src="hotspots.js"></script>
<script>
const mainRooms = window.MCKEAN_HOTSPOTS.mainHotspots;
const lowerRooms = window.MCKEAN_HOTSPOTS.lowerHotspots;
const allRooms = [...mainRooms, ...lowerRooms];

const mainStage = document.getElementById('mainStage');
const lowerStage = document.getElementById('lowerStage');
const info = document.getElementById('info');
const nameEl = document.getElementById('name');
const meta = document.getElementById('meta');
const note = document.getElementById('note');
const lowerInfo = document.getElementById('lowerInfo');
const lowerName = document.getElementById('lowerName');
const lowerMeta = document.getElementById('lowerMeta');
const lowerNote = document.getElementById('lowerNote');
const search = document.getElementById('search');
const results = document.getElementById('results');
const lowerModal = document.getElementById('lowerModal');

let selected = null;
let activeEl = null;

function addHotspot(room, parent){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'hotspot';
  b.style.left = room.x + '%';
  b.style.top = room.y + '%';
  b.style.width = room.w + '%';
  b.style.height = room.h + '%';
  b.title = room.id;
  b.setAttribute('aria-label', room.id);
  b.onclick = function(e){
    e.preventDefault();
    e.stopPropagation();
    if(selected === room){ deselect(); return; }
    selectRoom(room);
  };
  parent.appendChild(b);
  room._el = b;
}

function render(){
  mainRooms.forEach(r => addHotspot(r, mainStage));
  lowerRooms.forEach(r => addHotspot(r, lowerStage));
}

function clearActive(){
  if(activeEl) activeEl.classList.remove('active');
  activeEl = null;
}

function deselect(){
  clearActive();
  selected = null;
  info.classList.remove('show');
  lowerInfo.classList.remove('show');
}

function showMainInfo(room){
  info.classList.add('show');
  nameEl.textContent = room.id;
  meta.textContent = ' — ' + room.level + ' • ' + room.type;
  note.textContent = room.note || '';
}

function showLowerInfo(room){
  lowerInfo.classList.add('show');
  lowerName.textContent = room.id;
  lowerMeta.textContent = ' — ' + room.level + ' • ' + room.type;
  lowerNote.textContent = room.note || '';
}

function selectRoom(room){
  clearActive();
  selected = room;
  if(room._el){
    room._el.classList.add('active');
    activeEl = room._el;
  }

  showMainInfo(room);
  results.classList.remove('show');

  if(room.action === 'open-lower'){
    lowerModal.classList.add('open');
    return;
  }

  if(room.level === 'Lower Level'){
    lowerModal.classList.add('open');
    showLowerInfo(room);
    setTimeout(() => room._el && room._el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}), 80);
    return;
  }
}

function updateResults(){
  const q = search.value.trim().toLowerCase();
  results.innerHTML = '';
  if(!q){
    results.classList.remove('show');
    return;
  }
  const matches = allRooms.filter(r => [r.id,r.type,r.level,...r.aliases,r.note||''].join(' ').toLowerCase().includes(q)).slice(0,40);
  matches.forEach(r => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'result';
    b.innerHTML = '<strong>' + r.id + '</strong><br><span>' + r.level + ' • ' + r.type + '</span>';
    b.onclick = () => selectRoom(r);
    results.appendChild(b);
  });
  results.classList.toggle('show', matches.length > 0);
}

search.addEventListener('input', updateResults);
document.getElementById('clearBtn').onclick = () => {
  search.value = '';
  results.classList.remove('show');
  deselect();
};
document.getElementById('lowerBtn').onclick = () => lowerModal.classList.add('open');
document.getElementById('closeLower').onclick = () => {
  lowerModal.classList.remove('open');
  lowerInfo.classList.remove('show');
  deselect();
};

mainStage.addEventListener('click', function(e){
  if(e.target === mainStage) deselect();
});

// Less-sensitive long pull to refresh
(function(){
  const indicator = document.getElementById('refreshIndicator');
  let sx=0, sy=0, tracking=false, ready=false, multi=false;
  function isControl(t){ return !!(t.closest && t.closest('input,textarea,select,button')); }
  function show(text){ indicator.textContent=text; indicator.classList.add('show'); }
  function hide(){ indicator.classList.remove('show'); indicator.textContent='Release to refresh'; }
  document.addEventListener('touchstart', e => {
    if(e.touches.length > 1){ multi=true; tracking=false; ready=false; hide(); return; }
    multi=false;
    if(isControl(e.target)){ tracking=false; ready=false; hide(); return; }
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true; ready=false;
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if(!tracking || multi || e.touches.length !== 1) return;
    const t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(dy > 170 && Math.abs(dx) < 120){ ready=true; show('Release to refresh'); }
    else if(dy > 95 && Math.abs(dx) < 120){ ready=false; show('Keep pulling to refresh'); }
    else { ready=false; hide(); }
  }, {passive:true});
  document.addEventListener('touchend', () => {
    if(ready && !multi){ show('Refreshing...'); setTimeout(() => window.location.reload(), 80); }
    else hide();
    tracking=false; ready=false; multi=false;
  }, {passive:true});
  document.addEventListener('touchcancel', () => { tracking=false; ready=false; multi=false; hide(); }, {passive:true});
})();

render();
</script>
</body>
</html>
