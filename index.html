": "Classroom", "level": "Lower Level", "aliases": ["E32"], "x": 54.0, "y": 26.55, "w": 10, "h": 16, "note": "Lower Level room, next to E31."}, {"id": "E31", "type": "Classroom", "level": "Lower Level", "aliases": ["E31"], "x": 55.6, "y": 38.91, "w": 10, "h": 16, "note": "Lower Level room, next to E32."}, {"id": "Boys Locker Rooms", "type": "Facility", "level": "Lower Level", "aliases": ["Boys Locker Rooms"], "x": 24, "y": 58, "w": 19, "h": 15, "note": "Lower Level locker room area."}, {"id": "Girls Locker Rooms", "type": "Facility", "level": "Lower Level", "aliases": ["Girls Locker Rooms"], "x": 43, "y": 58, "w": 19, "h": 15, "note": "Lower Level locker room area."}, {"id": "Wrestling Room", "type": "Facility", "level": "Lower Level", "aliases": ["Wrestling Room"], "x": 53.71, "y": 55.99, "w": 19, "h": 23, "note": "Lower Level room near E31 and E32."}, {"id": "Swimming Pool", "type": "Facility", "level": "Lower Level", "aliases": ["Swimming Pool", "Pool"], "x": 29.0, "y": 68.0, "w": 20.0, "h": 16.0, "note": "Lower Level swimming pool area."}]};
const mainRooms = DATA.mainHotspots, lowerRooms = DATA.lowerHotspots, allRooms = [...mainRooms, ...lowerRooms];
const mainStage=document.getElementById('mainStage'), lowerStage=document.getElementById('lowerStage'), mainWrap=document.getElementById('mainWrap'), lowerWrap=document.getElementById('lowerWrap');
const info=document.getElementById('info'), nameEl=document.getElementById('name'), meta=document.getElementById('meta'), note=document.getElementById('note');
const lowerInfo=document.getElementById('lowerInfo'), lowerName=document.getElementById('lowerName'), lowerMeta=document.getElementById('lowerMeta'), lowerNote=document.getElementById('lowerNote');
const search=document.getElementById('search'), results=document.getElementById('results'), lowerModal=document.getElementById('lowerModal');
let selectedId=null, activeEl=null, mainZoom=1, lowerZoom=1; let fitTimer = null;
const MIN_ZOOM=.45, MAX_ZOOM=3, STEP=.2;
function addHotspot(room,parent){const el=document.createElement('div');el.className='hotspot';el.style.left=room.x+'%';el.style.top=room.y+'%';el.style.width=room.w+'%';el.style.height=room.h+'%';el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',room.id);el.dataset.roomId=room.id;el.addEventListener('click',e=>{e.stopPropagation();handleRoomTap(room,el);});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handleRoomTap(room,el);}});parent.appendChild(el);room._el=el;}
function render(){mainRooms.forEach(r=>addHotspot(r,mainStage));lowerRooms.forEach(r=>addHotspot(r,lowerStage));}
function clearActive(){if(activeEl)activeEl.classList.remove('active');activeEl=null;}
function deselect(){clearActive();selectedId=null;info.classList.remove('show');lowerInfo.classList.remove('show');}
function showMainInfo(room){
  info.classList.add('show');
  nameEl.textContent = room.id;
  meta.textContent = ' — ' + room.level + ' • ' + room.type;
  note.textContent = room.note || '';
}
function showLowerInfo(room){
  lowerInfo.classList.add('show');
  lowerName.textContent = room.id;
  lowerMeta.textContent = ' — ' + room.level + ' • ' + room.type;
  lowerNote.textContent = room.note || '';
}
function handleRoomTap(room,el){if(selectedId===room.id){deselect();return;}clearActive();selectedId=room.id;activeEl=el||room._el;if(activeEl)activeEl.classList.add('active');showMainInfo(room);results.classList.remove('show');if(room.action==='open-lower-room'){lowerModal.classList.add('open');const target=allRooms.find(r=>r.id===room.target);if(target){clearActive();selectedId=target.id;activeEl=target._el;if(activeEl)activeEl.classList.add('active');showMainInfo(target);showLowerInfo(target);}return;}if(room.action==='open-lower'){lowerModal.classList.add('open');return;}if(room.level==='Lower Level'){lowerModal.classList.add('open');showLowerInfo(room);}}
function searchTextForRoom(r){
  const aliases = Array.isArray(r.aliases) ? r.aliases : [];
  return [r.id || '', r.type || '', r.level || '', ...aliases, r.note || ''].join(' ').toLowerCase();
}
function roomMatchScore(r, needle){
  const id = String(r.id || '').toLowerCase();
  const aliases = (Array.isArray(r.aliases) ? r.aliases : []).map(a => String(a).toLowerCase());
  if(id === needle) return 0;
  if(aliases.includes(needle)) return 1;
  if(id.startsWith(needle)) return 2;
  if(aliases.some(a => a.startsWith(needle))) return 3;
  if(id.includes(needle)) return 4;
  if(aliases.some(a => a.includes(needle))) return 5;
  if(searchTextForRoom(r).includes(needle)) return 6;
  return 99;
}
function findExactRoom(q){
  const needle = q.trim().toLowerCase();
  if(!needle) return null;
  const ranked = allRooms
    .map(r => ({r, score: roomMatchScore(r, needle)}))
    .filter(x => x.score < 2)
    .sort((a,b) => a.score - b.score || String(a.r.id).localeCompare(String(b.r.id)));
  return ranked.length ? ranked[0].r : null;
}
function updateResults(){
  const q = search.value.trim().toLowerCase();
  results.innerHTML = '';
  if(!q){ results.classList.remove('show'); return; }

  const matches = allRooms
    .map(r => ({r, score: roomMatchScore(r, q)}))
    .filter(x => x.score < 99)
    .sort((a,b) => a.score - b.score || String(a.r.id).localeCompare(String(b.r.id)))
    .slice(0,40);

  if(!matches.length){
    const empty = document.createElement('div');
    empty.className = 'searchEmpty';
    empty.textContent = 'No matching room or location.';
    results.appendChild(empty);
    results.classList.add('show');
    return;
  }

  matches.forEach(({r}) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'result';
    b.innerHTML = '<strong>' + r.id + '</strong><br><span>' + r.level + ' • ' + r.type + '</span>';
    b.addEventListener('click', () => {
      search.value = r.id;
      results.classList.remove('show');
      handleRoomTap(r, r._el);
    });
    results.appendChild(b);
  });
  results.classList.add('show');
}
function currentContext(){return lowerModal.classList.contains('open')?'lower':'main';}
function applyZoom(stage,zoom,baseMax){if(Math.abs(zoom-1)<.01){stage.style.width='100%';stage.style.maxWidth=baseMax;}else{stage.style.maxWidth='none';stage.style.width=(zoom*100)+'%';}}
function applyZooms(){applyZoom(mainStage,mainZoom,'1600px');applyZoom(lowerStage,lowerZoom,'1000px');}
function setZoom(z){z=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,Math.round(z*100)/100));if(currentContext()==='lower')lowerZoom=z;else mainZoom=z;applyZooms();}
function fitMap(){
  const isLower = currentContext()==='lower';
  const stage = isLower ? lowerStage : mainStage;
  const wrap = isLower ? lowerWrap : mainWrap;

  const oldW = stage.style.width;
  const oldM = stage.style.maxWidth;

  // Measure the map at its normal responsive size.
  stage.style.width = '100%';
  stage.style.maxWidth = isLower ? '1000px' : '1600px';

  const rect = stage.getBoundingClientRect();
  const ratio = rect.height / Math.max(1, rect.width);

  const header = document.querySelector('header');
  const help = document.querySelector('.help');
  const modalHead = document.querySelector('.modalHead');

  const stickyHeight = isLower
    ? (modalHead ? modalHead.offsetHeight : 0) + (lowerInfo.classList.contains('show') ? lowerInfo.offsetHeight : 0)
    : (header ? header.offsetHeight : 0) + (info.classList.contains('show') ? info.offsetHeight : 0) + (help ? help.offsetHeight : 0);

  const availableH = Math.max(180, window.innerHeight - stickyHeight - 18);
  const heightAtFullWidth = wrap.clientWidth * ratio;
  const z = Math.max(MIN_ZOOM, Math.min(1, availableH / heightAtFullWidth));

  // Restore then apply final zoom.
  stage.style.width = oldW;
  stage.style.maxWidth = oldM;

  if(isLower) lowerZoom = z;
  else mainZoom = z;

  applyZooms();

  // Recenter the fitted map below the visible controls/info instead of behind them.
  const desiredTopGap = stickyHeight + 8;
  const currentTop = wrap.getBoundingClientRect().top;
  const scrollDelta = currentTop - desiredTopGap;

  if(isLower){
    lowerModal.scrollBy({top: scrollDelta, left: 0, behavior:'smooth'});
  } else {
    window.scrollBy({top: scrollDelta, left: 0, behavior:'smooth'});
  }
}
search.addEventListener('input', updateResults);
search.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    const exact = findExactRoom(search.value);
    if(exact){
      results.classList.remove('show');
      handleRoomTap(exact, exact._el);
      search.blur();
    }
  } else if(e.key === 'Escape'){
    results.classList.remove('show');
    search.blur();
  }
});document.getElementById('clearBtn').addEventListener('click',()=>{search.value='';results.classList.remove('show');deselect();});document.getElementById('lowerBtn').addEventListener('click',()=>lowerModal.classList.add('open'));document.getElementById('closeLower').addEventListener('click',()=>{lowerModal.classList.remove('open');lowerInfo.classList.remove('show');deselect();});
document.getElementById('zoomInBtn').addEventListener('click',()=>setZoom((currentContext()==='lower'?lowerZoom:mainZoom)+STEP));document.getElementById('zoomOutBtn').addEventListener('click',()=>setZoom((currentContext()==='lower'?lowerZoom:mainZoom)-STEP));document.getElementById('zoomFitBtn').addEventListener('click',fitMap);
window.addEventListener('resize', ()=>{ clearTimeout(fitTimer); fitTimer = setTimeout(()=>{ if(currentContext()==='main') fitMap(); }, 140); });
render();applyZooms();setTimeout(fitMap, 60);
</script></body></html>
